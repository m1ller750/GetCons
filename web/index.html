<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GetCons - an AI consultant for your business in WhatsApp, Telegram and on your website. On Pro it becomes an agent that takes orders and handles returns." />
    <meta name="theme-color" content="#17181c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GetCons - AI consultants and agents for WhatsApp, Telegram and websites</title>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the app as soon as it starts. Shown only when the file is opened directly
           from disk (file://), where browsers block the app's scripts. -->
      <div style="opacity:0;animation:gc-hint 0s 1.5s forwards;max-width:34rem;margin:15vh auto;padding:0 1.5rem;font:16px/1.6 system-ui,sans-serif;color:#334155">
        <style>@keyframes gc-hint{to{opacity:1}}</style>
        <h1 style="font-size:1.4rem;color:#4c1d95">GetCons opens in the browser, not as a file</h1>
        <p>This page is part of the app's source code. Start the server and open <a href="http://localhost:8080">http://localhost:8080</a> (or your Railway address).</p>
        <p lang="ru">Это исходный файл сайта, его нельзя открыть двойным щелчком. Запустите сервер и откройте <a href="http://localhost:8080">http://localhost:8080</a> (или адрес на Railway).</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
